<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Neutral mid-grey grain: mid-grey is the no-op value for overlay and
       soft-light, so one texture tints correctly against a pale or a dark
       surface without shifting its hue. -->
  <filter id="parchment" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.5 0.09" numOctaves="5" seed="7" stitchTiles="stitch" result="fibre" />
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="19" stitchTiles="stitch" result="foxing" />
    <feComposite in="fibre" in2="foxing" operator="arithmetic" k1="0" k2="0.62" k3="0.38" k4="0" result="mixed" />
    <feColorMatrix in="mixed" type="saturate" values="0" result="grey" />
    <feComponentTransfer in="grey">
      <feFuncR type="linear" slope="0.17" intercept="0.415" />
      <feFuncG type="linear" slope="0.17" intercept="0.415" />
      <feFuncB type="linear" slope="0.17" intercept="0.415" />
      <feFuncA type="linear" slope="0" intercept="1" />
    </feComponentTransfer>
  </filter>
  <rect width="480" height="480" filter="url(#parchment)" />
</svg>
